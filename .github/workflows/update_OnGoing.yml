name: Update VCT Calendar

on:
  workflow_dispatch:
    inputs:
      simulate_failure:
        description: "演练：故意让本次运行失败，用来验证失败告警"
        type: boolean
        default: false
  push:
    branches:
      - main
    paths:
      - ".github/workflows/update_OnGoing.yml"
      - ".github/scripts/failure_issue.sh"
      - "update_calendar.py"
      - "events.toml"
      - "requirements.txt"
  schedule:
    # Not on the hour: runs scheduled at :00 were starting 5 to 7 hours late.
    - cron: "23 14 * * *"
      timezone: "Australia/Sydney"

permissions:
  contents: write
  actions: write
  issues: write

concurrency:
  group: update-vct-calendar
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run tests
        run: python -m unittest discover -s tests

      - name: Simulate a failure (drill)
        if: ${{ inputs.simulate_failure }}
        run: |
          echo "ERROR: 这是一次告警演练，不是真实故障" | tee update.log
          exit 1

      - name: Update calendar
        shell: bash
        run: python update_calendar.py 2>&1 | tee update.log

      - name: Validate generated files
        run: python update_calendar.py --check

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- vct_OnGoing.ics vct_OnGoing.txt data feeds Calendar_Files TEXT_Files
          if git diff --cached --quiet; then
            echo "No calendar changes"
            exit 0
          fi
          git commit -m "chore: update VCT calendar"
          git push

      # The calendar is published even when discovery could not run, but that
      # still needs a human to look, so turn it into a failed run.
      - name: Fail on warnings
        run: |
          if grep '^WARNING:' update.log; then
            echo "更新已发布，但有上面这些警告需要处理"
            exit 1
          fi

      - name: Report failure as an issue
        if: failure()
        run: bash .github/scripts/failure_issue.sh report

      - name: Close the failure issue after a successful run
        if: success()
        run: bash .github/scripts/failure_issue.sh resolve

      # GitHub disables scheduled workflows after 60 days without repository
      # activity. Re-enabling through the API counts as activity, so the
      # calendar keeps updating through the off-season.
      - name: Keep scheduled workflows enabled
        if: always()
        run: |
          for workflow in update_OnGoing.yml live_update.yml; do
            gh api --method PUT "repos/${{ github.repository }}/actions/workflows/${workflow}/enable"
          done
