name: Update VCT Stage 2 Calendar

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/update_OnGoing.yml"
      - "update_stage2_calendar.py"
      - "requirements.txt"
  schedule:
    - cron: "0 14 * * *"
      timezone: "Australia/Sydney"

permissions:
  contents: write

concurrency:
  group: update-vct-stage-2-calendar
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Update calendar
        run: python update_stage2_calendar.py

      - name: Validate generated files
        run: python update_stage2_calendar.py --check

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- vct_OnGoing.ics vct_OnGoing.txt data/vct_stage2_matches.json
          if git diff --cached --quiet; then
            echo "No calendar changes"
            exit 0
          fi
          git commit -m "chore: update VCT Stage 2 calendar"
          git push
