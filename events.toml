# 订阅日历（vct_OnGoing.ics）的配置。改完推送，GitHub Actions 会自动重新生成日历。

[calendar]
name = "VCT Matches"
display_timezone = "Australia/Sydney"
# 赛事全部打完后，在订阅日历里再保留几天（方便看最终比分），之后自动归档到 Calendar_Files/
keep_finished_days = 7
# 日历事件标题里是否显示比分。true：有比分后标题变成 "[CN] A 2:1 B"；
# false：标题始终是 "[CN] A vs B (Bo3)"，比分只写在事件描述里（避免剧透）
score_in_title = true

# 自动发现：每次运行读取 vlr.gg 的赛事列表，自动跟踪进行中和即将开始的 VCT 一级赛事
# （四大赛区的 Kickoff / Stage 1 / Stage 2、Masters、Champions），不需要每个赛季手动改配置。
[discovery]
enabled = true

# 探针：每次运行先解析一个已结束赛事的页面，场次对不上就判定 VLR 页面结构变了，
# 本次不更新并自动开 Issue。默认用 Valorant Champions 2026（34 场），一般不用改。
# 如果 VLR 把这个页面下线了，可以换一个赛事，或者用 enabled = false 关掉。
#
# [canary]
# event_id = 2766
# slug = "valorant-champions-2026"
# min_matches = 34

# 自动发现覆盖不到的赛事（预选赛、第三方赛事等）可以在这里手动添加，
# 每个 [[events]] 对应 vlr.gg 上的一个赛事页：
#   https://www.vlr.gg/event/matches/<event_id>/<slug>/
#
#   region       日历标题里的标签，例如 [CN]
#   event_id     vlr.gg 赛事 ID（URL 里的数字）
#   slug         vlr.gg 赛事 URL 里的名称部分
#   name         赛事全称，写进日历事件的描述
#   min_matches  可选，默认 0。抓到的场次少于它就拒绝覆盖现有日历
#   archive      可选，归档文件名（不含扩展名），默认根据赛事名生成
#
# [[events]]
# region = "CN"
# event_id = 2894
# slug = "china-evolution-series-2026-act-1"
# name = "China Evolution Series 2026: Act 1"
